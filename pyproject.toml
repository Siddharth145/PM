[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "process-mining-kpi-api"
version = "1.0.0"
description = "An API for process mining, variant analysis, and KPI calculation."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "pandas>=2.0.0",
    "pm4py>=2.7.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0.0",
]


